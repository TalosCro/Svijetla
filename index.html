<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14171c">
<title>Svjetla doma</title>
<style>
:root{color-scheme:dark;--bg:#14171c;--card:#1d2229;--line:#2c333d;--ink:#eef0f3;--mut:#9aa3af;--warm:#ffb547;--warm2:#ffd08a;--ok:#4cc38a;--bad:#ef5f5f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 12px 32px;max-width:560px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.hd{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.hd h1{flex:1;margin:0;font-size:22px;font-weight:700}
.btn{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px}
.btn.pri{background:var(--warm);border-color:var(--warm);color:#1a1205;font-weight:600}
.icon{width:38px;padding:0;display:grid;place-items:center}
#list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 12px}
.card.on{border-color:#5a4520}
.top{display:flex;align-items:center;gap:10px;min-height:32px}
.dot{width:8px;height:8px;border-radius:50%;background:#4b535e;flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warm);animation:p 1s infinite}.dot.err{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
.nm{flex:1;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:6px 0}
.pc{font-size:15px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.on .pc{color:var(--warm)}
.sw{width:50px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .18s,background .18s}
.sw[aria-pressed=true]{background:#4a3a1c;border-color:var(--warm)}.sw[aria-pressed=true]::after{left:23px;background:var(--warm)}
.st{font-size:12px;color:var(--mut);margin:-2px 0 4px 18px}
.st.err{color:#f19090}
.gr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.ch{height:50px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 4px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ch span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch b{font-size:14px}
.ch.on{background:#3a2e17;border-color:var(--warm);color:var(--warm2)}
.ch.press{transform:scale(.96)}
.add{width:100%;height:52px;border-radius:16px;border:1px dashed var(--line);background:none;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:10px 4px 0}
.warn{background:#3a2020;border:1px solid #6b3030;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
dialog.sh{margin:auto 0 0;width:100%;max-width:100%;border:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;background:var(--card);color:var(--ink);padding:10px 18px 24px}
dialog.sh::backdrop{background:rgba(0,0,0,.55)}
@media(min-width:600px){dialog.sh{max-width:520px;margin:auto;border-radius:22px;border:1px solid var(--line)}}
.grip{width:40px;height:4px;border-radius:2px;background:#3a424d;margin:0 auto 14px}
.shh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shh div{flex:1}.shh small{display:block;font-size:13px;color:var(--mut)}.shh strong{font-size:20px}
.sl{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sl input{flex:1;height:44px;accent-color:var(--warm)}
.sl output{font-size:28px;font-weight:700;color:var(--warm);width:76px;text-align:right;font-variant-numeric:tabular-nums}
.pre{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.pre button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);margin-bottom:12px}
input[type=text],input[type=password]{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;height:44px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 12px}
#log{white-space:pre-wrap;font:11px/1.4 ui-monospace,monospace;max-height:40vh;overflow:auto;background:#0d0f12;padding:10px;border-radius:10px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="hd">
  <h1>Svjetla doma</h1>
  <button class="btn pri" id="bAll1">Sve upali</button>
  <button class="btn" id="bAll0">Sve ugasi</button>
  <button class="btn icon" id="bSet" aria-label="Postavke"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id="warn"></div>
<div id="list"></div>
<button class="add" id="bAdd" style="margin-top:10px">+ Dodaj kontroler</button>
<p class="hint">Tap na grupu pali/gasi. Dugi pritisak na grupu ili naziv kontrolera otvara jačinu.</p>

<dialog class="sh" id="sheet">
  <div class="grip"></div>
  <div class="shh"><div><small id="sSub"></small><strong id="sTitle"></strong></div><button class="sw" id="sSw" aria-label="Upali ili ugasi"></button></div>
  <div class="sl"><input type="range" id="sRange" min="0" max="100" step="1" aria-label="Jačina svjetla"><output id="sOut">0%</output></div>
  <div class="pre"><button data-p="10">10%</button><button data-p="30">30%</button><button data-p="60">60%</button><button data-p="100">100%</button></div>
  <label class="f" id="sNameL">Naziv grupe<input type="text" id="sName" autocomplete="off"></label>
  <div class="row" id="sCtrlBtns"><button class="btn" id="sConn">Spoji ponovno</button><button class="btn" id="sPw">Lozinka</button><button class="btn" id="sDel">Ukloni</button></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="sClose">Zatvori</button></div>
</dialog>

<dialog class="sh" id="setd">
  <div class="grip"></div>
  <div class="shh"><div><strong>Postavke</strong></div></div>
  <button class="btn" id="bConn" style="width:100%;height:44px">Spoji sve kontrolere</button>
  <label class="chk"><input type="checkbox" id="optUser"> Prijava kao korisnik (umjesto administratora)</label>
  <button class="btn" id="bForget" style="width:100%;height:44px;margin-bottom:12px">Zaboravi spremljene lozinke i tokene</button>
  <div style="font-size:13px;color:var(--mut);margin-bottom:6px">Dnevnik</div>
  <div id="log"></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="setClose">Zatvori</button></div>
</dialog>

<dialog class="sh" id="dlg">
  <form method="dialog">
    <div class="grip"></div>
    <div class="shh"><div><strong>Lozinka</strong></div></div>
    <div id="dtxt" style="color:var(--mut);font-size:14px"></div>
    <input type="password" id="dpw" autocomplete="current-password" placeholder="Lozinka kontrolera" style="margin:12px 0 4px">
    <label class="chk"><input type="checkbox" id="dsave" checked> Zapamti na ovom mobitelu</label>
    <div class="row"><button class="btn" value="cancel">Odustani</button><button class="btn pri" value="ok">Prijava</button></div>
  </form>
</dialog>

<script>
{

const UUID={
  light:'bc183193-fceb-4838-904b-e78a6252739a',
  cmd:'3afd53a0-7d7e-11e5-9a46-0002a5d5c51b',
  lvl:'41f520f8-513d-444f-898f-53c97aa00e25',
  conf:'be5e5100-7e4a-11e5-a47f-0002a5d5c51b',
  med:'c89732e0-7e4a-11e5-bb70-0002a5d5c51b',
  ident:'125e2520-7d9f-11e5-99f9-0002a5d5c51b'
};
const DEFAULT_PW=hex('5d06ff8a51d9823e8cf5e0a609d4257d');
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hex(s){return new Uint8Array(s.match(/../g).map(h=>parseInt(h,16)))}
function toHex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function log(...a){const l=$('#log');l.textContent=(new Date().toLocaleTimeString()+' '+a.join(' ')+'\n'+l.textContent).slice(0,20000)}
const store={get(k,d){try{const v=localStorage.getItem('svj_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('svj_'+k,JSON.stringify(v))}catch{}}};

/* DALI log curve, same as original app */
const pctToDali=p=>p<=0?0:Math.min(254,Math.round((Math.log10(Math.min(100,p))+1)*84.33333333333333+1));
const daliToPct=v=>v===0||v===255?0:Math.round(10**((v-1)/84.33333333333333-1));

/* Password encryption: PBKDF2-SHA1(1000) -> AES-256-CBC, as in original app */
let aesKey,aesIv;
async function initCrypto(){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode('2F$5b9'),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-1',salt:enc.encode('LUXeye - OSRAM - 2016 !1#2#3%'),iterations:1000},base,48*8));
  aesKey=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['encrypt']);
  aesIv=bits.slice(32,48);
}
function strBytes(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);if(c<128)o.push(c);else if(c<256)o.push(c)}return new Uint8Array(o)}
async function encryptPwd(pw){if(!aesKey)await initCrypto();return new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv:aesIv},aesKey,strBytes(pw)))}
async function authHash(userType,cr,sc,pw16){
  const b=new Uint8Array(33);b[0]=userType;b.set(cr,1);b.set(sc,9);b.set(pw16.slice(0,16),17);
  return new Uint8Array(await crypto.subtle.digest('SHA-256',b)).slice(0,8);
}

class Ctrl{
  constructor(dev){this.dev=dev;this.id=dev.id;this.state='idle';this.msg='Nije spojen';this.on=false;this.pct=0;this.q=Promise.resolve();this.fmt=store.get('fmt_'+dev.id,'ext');
    this.name=niceName(dev.name||store.get('name_'+dev.id,'Kontroler'));if(dev.name)store.set('name_'+dev.id,dev.name);
    dev.addEventListener('gattserverdisconnected',()=>{this.set('idle','Veza prekinuta');this.chars=null});}
  set(s,m){this.state=s;this.msg=m;render()}
  run(fn){const p=this.q.then(fn,fn);this.q=p.catch(()=>{});return p}
  async connect(){
    if(this.dev.gatt.connected&&this.chars)return;
    this.set('busy','Spajanje…');
    try{
      const srv=await this.dev.gatt.connect();
      const ls=await srv.getPrimaryService(UUID.light),cs=await srv.getPrimaryService(UUID.conf);
      this.chars={cmd:await ls.getCharacteristic(UUID.cmd),lvl:await ls.getCharacteristic(UUID.lvl),med:await cs.getCharacteristic(UUID.med)};
      this.set('busy','Prijava…');
      await this.auth();
      await this.readState();
      try{await this.chars.lvl.startNotifications();this.chars.lvl.addEventListener('characteristicvaluechanged',e=>this.onLevel(new Uint8Array(e.target.value.buffer)))}catch(e){log(this.name,'notify',e.message)}
      this.set('ok','Spojen');
    }catch(e){log(this.name,'GREŠKA',e.message);this.set('err',e.message.slice(0,80));try{this.dev.gatt.disconnect()}catch{}this.chars=null;throw e}
  }
  /* Medium property: [topic, prop, flags, data(17)] write, then poll-read for valid answer */
  async medium(topic,prop,data){
    const pkt=new Uint8Array(20);pkt[0]=topic;pkt[1]=prop;pkt.set(data,3);
    await this.chars.med.writeValueWithResponse(pkt);await sleep(50);
    const t0=Date.now();
    while(Date.now()-t0<2500){
      const v=new Uint8Array((await this.chars.med.readValue()).buffer);
      if(v[0]===topic&&v[1]===prop&&(v[2]&2)&&!(v[2]&4))return v.slice(3);
      await sleep(70);
    }
    throw new Error('Kontroler ne odgovara');
  }
  async auth(){
    const ut=$('#optUser').checked?2:1;
    const tok=hex(store.get('tok_'+this.id+'_'+ut,'0000000000000000'));
    const ch=await this.medium(14,0,new Uint8Array([ut,...tok]));
    const ans=ch[0];log(this.name,'challenge odgovor',ans);
    if(ans===0)return;
    let pw16;
    if(ans===1)pw16=DEFAULT_PW;
    else if(ans===2){
      let pw=store.get('pw_'+this.id,null);
      if(pw==null){pw=await askPw(this.name);if(pw==null)throw new Error('Prijava otkazana')}
      pw16=await encryptPwd(pw);this._pw=pw;
    }else throw new Error(ans===3?'Previše pokušaja, pričekaj pa probaj opet':'Kontroler odbija prijavu ('+ans+')');
    const sc=ch.slice(1,9),cr=crypto.getRandomValues(new Uint8Array(8));
    const h=await authHash(ut,cr,sc,pw16);
    const r=await this.medium(14,1,new Uint8Array([ut,...cr,...h]));
    const t=r.slice(0,8);
    if(t.every(x=>x===0)){store.set('pw_'+this.id,null);throw new Error(ans===2?'Kriva lozinka':'Prijava odbijena')}
    store.set('tok_'+this.id+'_'+ut,toHex(t));
    if(this._pw!=null&&this._save)store.set('pw_'+this.id,this._pw);
    log(this.name,'prijava OK');
  }
  async readState(){
    try{const v=new Uint8Array((await this.chars.lvl.readValue()).buffer);this.onLevel(v)}catch(e){log(this.name,'čitanje razine',e.message)}
    await this.readGroups();
  }
  /* LiveData topic 7, prop 30: data[1+3*i] = DALI level of group i+1 */
  async readGroups(){
    if(this.fmt!=='ext')return;
    try{const d=await this.medium(7,30,new Uint8Array(13));
      this.groups=[0,1,2,3].map(i=>{const v=d[1+3*i];return {on:v>0&&v!==255,pct:daliToPct(v)}});render();
    }catch(e){log(this.name,'čitanje grupa',e.message)}
  }
  setGroupOn(g,on){return this.run(async()=>{await this.connect();const s=on?1:0;
    await this.chars.cmd.writeValueWithResponse(new Uint8Array([s,1,1,g]));
    await sleep(150);await this.readGroups()})}
  setGroupPct(g,p){return this.run(async()=>{await this.connect();const d=pctToDali(p);
    await this.chars.lvl.writeValueWithResponse(new Uint8Array([d,0,0,0,1,1,g]));
    if(this.groups)this.groups[g-1]={on:d>0,pct:p};render()})}
  onLevel(v){if(!v.length)return;this.pct=daliToPct(v[0]);this.on=v[0]>0&&v[0]!==255;render()}
  async write(ch,ext,short){
    if(this.fmt==='ext'){
      try{await ch.writeValueWithResponse(ext);return}
      catch(e){log(this.name,'prošireni format odbijen, probam kratki',e.message);this.fmt='short';store.set('fmt_'+this.id,'short')}
    }
    await ch.writeValueWithResponse(short);
  }
  setOn(on){return this.run(async()=>{await this.connect();const s=on?1:0;
    await this.write(this.chars.cmd,new Uint8Array([s,1,0,0]),new Uint8Array([s]));
    this.on=on;if(on&&!this.pct)this.pct=100;await sleep(150);await this.readState();render()})}
  setPct(p){return this.run(async()=>{await this.connect();const d=pctToDali(p);
    await this.write(this.chars.lvl,new Uint8Array([d,0,0,0,1,0,0]),new Uint8Array([d,0,0,0]));
    this.pct=p;this.on=d>0;await sleep(150);await this.readGroups();render()})}
  forget(){try{this.dev.gatt.disconnect()}catch{}const ids=store.get('ids',[]).filter(i=>i!==this.id);store.set('ids',ids);ctrls.delete(this.id);try{this.dev.forget&&this.dev.forget()}catch{}render()}
}
function niceName(n){const i=n.search(/[_-]/);return (i>=0&&/^(Osbt|Invt|Ledv|Leye)/.test(n)?n.slice(i+1):n).trim()||n}


const ctrls=new Map();
let pwResolve;
function askPw(name){return new Promise(res=>{pwResolve=res;$('#dtxt').textContent='Kontroler „'+name+'“ traži lozinku koju si postavio u BT Config aplikaciji.';$('#dpw').value='';$('#dlg').showModal()})}
$('#dlg').addEventListener('close',()=>{const ok=$('#dlg').returnValue==='ok';const v=$('#dpw').value;for(const c of ctrls.values())c._save=$('#dsave').checked;pwResolve&&pwResolve(ok?v:null);pwResolve=null});

const gName=(c,g)=>store.get('gname_'+c.id+'_'+g,'Grupa '+g);
const gState=(c,g)=>c.groups?c.groups[g-1]:null;

/* tap vs long press */
function press(el,onTap,onLong){
  let t=null,long=false;
  el.addEventListener('pointerdown',e=>{long=false;el.classList.add('press');t=setTimeout(()=>{long=true;t=null;el.classList.remove('press');navigator.vibrate&&navigator.vibrate(15);onLong()},450)});
  const end=()=>{el.classList.remove('press');if(t){clearTimeout(t);t=null}};
  el.addEventListener('pointerup',()=>{const was=!!t;end();if(was&&!long)onTap()});
  el.addEventListener('pointerleave',end);el.addEventListener('pointercancel',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.shiftKey?onLong():onTap()}});
}

function card(c){
  const el=document.createElement('div');el.className='card';el.id='c_'+c.id;
  el.innerHTML='<div class="top"><span class="dot"></span><button class="nm"></button><span class="pc"></span><button class="sw" aria-label="Upali ili ugasi cijeli kontroler"></button></div><div class="st"></div><div class="gr">'+
    [1,2,3,4].map(g=>'<button class="ch" data-g="'+g+'"><span></span><b></b></button>').join('')+'</div>';
  el.querySelector('.sw').onclick=()=>c.setOn(!c.on).catch(()=>{});
  press(el.querySelector('.nm'),()=>{if(c.state!=='ok')c.run(()=>c.connect()).catch(()=>{});else openSheet(c,0)},()=>openSheet(c,0));
  el.querySelectorAll('.ch').forEach(b=>{const g=+b.dataset.g;
    press(b,()=>{const s=gState(c,g);c.setGroupOn(g,!(s&&s.on)).catch(()=>{})},()=>openSheet(c,g))});
  return el;
}
function render(){
  const L=$('#list');
  for(const el of [...L.children])if(!ctrls.has(el.id.slice(2)))el.remove();
  if(!ctrls.size&&!L.querySelector('.hint0'))L.innerHTML='<p class="hint hint0" style="margin:0 4px">Još nema kontrolera. Tapni <b>+ Dodaj kontroler</b> i odaberi jedan od Osram uređaja, pa ponovi za sva četiri.</p>';
  if(ctrls.size)L.querySelector('.hint0')?.remove();
  for(const c of ctrls.values()){
    let el=document.getElementById('c_'+c.id);if(!el){el=card(c);L.appendChild(el)}
    el.classList.toggle('on',c.on);
    el.querySelector('.dot').className='dot '+(c.state==='ok'?'ok':c.state==='busy'?'busy':c.state==='err'?'err':'');
    el.querySelector('.nm').textContent=c.name;
    el.querySelector('.pc').textContent=c.on?c.pct+'%':'';
    el.querySelector('.sw').setAttribute('aria-pressed',c.on);
    const st=el.querySelector('.st');const showSt=c.state!=='ok';st.style.display=showSt?'':'none';
    st.textContent=c.state==='idle'?c.msg+' · tapni naziv za spajanje':c.msg;st.classList.toggle('err',c.state==='err');
    const gr=el.querySelector('.gr');gr.style.display=c.fmt==='ext'?'':'none';
    gr.querySelectorAll('.ch').forEach(b=>{const g=+b.dataset.g,s=gState(c,g);
      b.querySelector('span').textContent=gName(c,g);b.querySelector('b').textContent=s?(s.on?s.pct+'%':'off'):'–';
      b.classList.toggle('on',!!(s&&s.on));b.setAttribute('aria-label',gName(c,g)+', '+(s&&s.on?s.pct+' posto':'ugašeno'))});
  }
  if(cur)fillSheet();
}

/* bottom sheet: g=0 whole controller, 1-4 group */
let cur=null,slTimer;
function openSheet(c,g){cur={c,g};fillSheet(true);$('#sheet').showModal()}
function fillSheet(first){
  const {c,g}=cur;if(!ctrls.has(c.id)){$('#sheet').close();return}
  const s=g?gState(c,g):{on:c.on,pct:c.pct};const on=!!(s&&s.on),p=s&&s.on?s.pct:0;
  $('#sSub').textContent=g?c.name:'Cijeli kontroler';$('#sTitle').textContent=g?gName(c,g):c.name;
  $('#sSw').setAttribute('aria-pressed',on);
  if(document.activeElement!==$('#sRange')){$('#sRange').value=p;$('#sOut').textContent=p+'%'}
  $('#sNameL').style.display=g?'':'none';if(first)$('#sName').value=g?gName(c,g):'';
  $('#sCtrlBtns').style.display=g?'none':'';
}
const apply=p=>{const {c,g}=cur;(g?c.setGroupPct(g,p):c.setPct(p)).catch(()=>{})};
$('#sRange').addEventListener('input',e=>{$('#sOut').textContent=e.target.value+'%';clearTimeout(slTimer);slTimer=setTimeout(()=>apply(+e.target.value),180)});
document.querySelectorAll('#sheet .pre button').forEach(b=>b.onclick=()=>{$('#sRange').value=b.dataset.p;$('#sOut').textContent=b.dataset.p+'%';apply(+b.dataset.p)});
$('#sSw').onclick=()=>{const {c,g}=cur;const on=$('#sSw').getAttribute('aria-pressed')==='true';(g?c.setGroupOn(g,!on):c.setOn(!on)).catch(()=>{})};
$('#sName').addEventListener('change',()=>{const {c,g}=cur;if(g){store.set('gname_'+c.id+'_'+g,$('#sName').value.trim()||'Grupa '+g);render()}});
$('#sConn').onclick=()=>{const {c}=cur;try{c.dev.gatt.disconnect()}catch{}c.chars=null;c.run(()=>c.connect()).catch(()=>{})};
$('#sPw').onclick=async()=>{const {c}=cur;$('#sheet').close();const pw=await askPw(c.name);if(pw!=null){store.set('pw_'+c.id,pw);store.set('tok_'+c.id+'_1',null);store.set('tok_'+c.id+'_2',null);log(c.name,'lozinka spremljena')}};
$('#sDel').onclick=()=>{const {c}=cur;$('#sheet').close();c.forget()};
$('#sClose').onclick=()=>$('#sheet').close();
$('#sheet').addEventListener('close',()=>{cur=null});
for(const d of ['#sheet','#setd'])$(d).addEventListener('click',e=>{if(e.target===$(d))$(d).close()});

function addDev(dev){if(ctrls.has(dev.id))return ctrls.get(dev.id);const c=new Ctrl(dev);ctrls.set(dev.id,c);const ids=store.get('ids',[]);if(!ids.includes(dev.id)){ids.push(dev.id);store.set('ids',ids)}render();return c}
$('#bAdd').onclick=async()=>{
  try{const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Osbt'},{namePrefix:'Invt'},{namePrefix:'Ledv'},{namePrefix:'Leye'}],optionalServices:[UUID.light,UUID.conf,UUID.ident]});
    const c=addDev(dev);c.run(()=>c.connect()).catch(()=>{});
  }catch(e){if(e.name!=='NotFoundError')log('Dodavanje',e.message)}
};
$('#bSet').onclick=()=>$('#setd').showModal();
$('#setClose').onclick=()=>$('#setd').close();
$('#bConn').onclick=()=>{for(const c of ctrls.values())c.run(()=>c.connect()).catch(()=>{})};
$('#bAll1').onclick=()=>{for(const c of ctrls.values())c.setOn(true).catch(()=>{})};
$('#bAll0').onclick=()=>{for(const c of ctrls.values())c.setOn(false).catch(()=>{})};
$('#optUser').checked=store.get('user',false);
$('#optUser').onchange=e=>store.set('user',e.target.checked);
$('#bForget').onclick=()=>{try{Object.keys(localStorage).filter(k=>/^svj_(pw|tok)_/.test(k)).forEach(k=>localStorage.removeItem(k))}catch{}log('Lozinke i tokeni obrisani')};

(async()=>{
  if(!navigator.bluetooth){$('#warn').innerHTML='<div class="warn">Ovaj preglednik ne podržava Web Bluetooth. Otvori stranicu u <b>Chromeu na Androidu</b>.</div>';['#bAdd','#bConn','#bAll1','#bAll0'].forEach(s=>$(s).disabled=true);render();return}
  if(navigator.bluetooth.getDevices){
    try{const devs=await navigator.bluetooth.getDevices();const ids=store.get('ids',[]);
      for(const id of ids){const d=devs.find(x=>x.id===id);if(d)addDev(d)}
      if(ctrls.size){log('Pronađeno spremljenih kontrolera:',ctrls.size);for(const c of ctrls.values())c.run(()=>c.connect()).catch(()=>{})}
    }catch(e){log('getDevices',e.message)}
  }else log('Preglednik ne pamti uređaje između posjeta; kontrolere dodaj ponovno nakon osvježavanja.');
  render();
})();
}
</script>
</body>
</html>
