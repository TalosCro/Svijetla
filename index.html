<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14171c">
<title>Svjetla doma</title>
<style>
:root{color-scheme:dark;--bg:#14171c;--card:#1d2229;--line:#2c333d;--ink:#eef0f3;--mut:#9aa3af;--warm:#ffb547;--ok:#4cc38a;--bad:#ef5f5f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px max(4vw,14px) 40px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
button.pri{background:var(--warm);color:#1a1205;border-color:var(--warm);font-weight:600}
button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.card.on{border-color:#5a4520}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 85% 0%,rgba(255,181,71,var(--g,0)),transparent 60%);transition:opacity .3s}
.top{display:flex;align-items:center;gap:10px;position:relative}
.name{font-weight:650;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warm)}.dot.err{background:var(--bad)}
.st{font-size:13px;color:var(--mut);margin:4px 0 12px;position:relative;min-height:18px}
.sw{width:64px;height:36px;border-radius:18px;padding:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--mut);transition:left .2s,background .2s}
.sw[aria-pressed=true]{background:#4a3a1c;border-color:var(--warm)}
.sw[aria-pressed=true]::after{left:32px;background:var(--warm)}
.lvl{display:flex;align-items:center;gap:12px;position:relative}
.pct{font-size:22px;font-weight:650;width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:44px;accent-color:var(--warm)}
.pre{display:flex;gap:6px;margin-top:8px;position:relative}
.pre button{flex:1;min-height:40px;padding:0 6px;font-size:14px}
.act{display:flex;gap:6px;margin-top:10px;position:relative}
.act button{min-height:36px;font-size:13px;padding:0 10px;color:var(--mut)}
.grps{position:relative;margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.grps summary{cursor:pointer;color:var(--mut);font-size:14px;min-height:36px;display:flex;align-items:center}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.g:last-child{border-bottom:0}
.g input[type=text]{margin:0;min-height:36px;background:transparent;border-color:transparent;padding:0 4px;font-weight:600}
.g input[type=text]:focus{border-color:var(--line);background:var(--bg)}
.g .lvl{grid-column:1/-1}.g .pct{font-size:16px}
.g .sw{width:52px;height:30px}.g .sw::after{width:22px;height:22px}.g .sw[aria-pressed=true]::after{left:26px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 18px;color:var(--mut);text-align:center}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
input[type=password],input[type=text]{font:inherit;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;margin:10px 0}
.row{display:flex;gap:8px;justify-content:flex-end}
details{margin-top:24px;color:var(--mut);font-size:13px}
#log{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;max-height:320px;overflow:auto;background:#0d0f12;padding:10px;border-radius:10px}
.warn{background:#3a2020;border:1px solid #6b3030;border-radius:12px;padding:12px;margin-bottom:14px;font-size:14px}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
</style>
</head>
<body>
<h1>Svjetla doma</h1>
<p class="sub">Svi DALI ECO BT kontroleri na jednom mjestu</p>
<div id="warn"></div>
<div class="bar">
  <button class="pri" id="bAll1">Sve upali</button>
  <button id="bAll0">Sve ugasi</button>
  <button id="bConn">Spoji sve</button>
  <button id="bAdd">+ Dodaj kontroler</button>
</div>
<div class="grid" id="grid"></div>

<dialog id="dlg">
  <form method="dialog" id="dform">
    <h3 style="margin:0 0 4px">Lozinka</h3>
    <div id="dtxt" style="color:var(--mut);font-size:14px"></div>
    <input type="password" id="dpw" autocomplete="current-password" placeholder="Lozinka kontrolera">
    <label class="chk"><input type="checkbox" id="dsave" checked> Zapamti na ovom mobitelu</label>
    <div class="row"><button value="cancel" type="submit">Odustani</button><button class="pri" value="ok" type="submit">Prijava</button></div>
  </form>
</dialog>

<details>
  <summary>Postavke i dnevnik</summary>
  <label class="chk"><input type="checkbox" id="optUser"> Prijava kao korisnik (umjesto administratora)</label>
  <button id="bForget" style="margin:6px 0 10px">Zaboravi spremljene lozinke i tokene</button>
  <div id="log"></div>
</details>

<script>
{
const UUID={
  light:'bc183193-fceb-4838-904b-e78a6252739a',
  cmd:'3afd53a0-7d7e-11e5-9a46-0002a5d5c51b',
  lvl:'41f520f8-513d-444f-898f-53c97aa00e25',
  conf:'be5e5100-7e4a-11e5-a47f-0002a5d5c51b',
  med:'c89732e0-7e4a-11e5-bb70-0002a5d5c51b',
  ident:'125e2520-7d9f-11e5-99f9-0002a5d5c51b'
};
const DEFAULT_PW=hex('5d06ff8a51d9823e8cf5e0a609d4257d');
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hex(s){return new Uint8Array(s.match(/../g).map(h=>parseInt(h,16)))}
function toHex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function log(...a){const l=$('#log');l.textContent=(new Date().toLocaleTimeString()+' '+a.join(' ')+'\n'+l.textContent).slice(0,20000)}
const store={get(k,d){try{const v=localStorage.getItem('svj_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('svj_'+k,JSON.stringify(v))}catch{}}};

/* DALI log curve, same as original app */
const pctToDali=p=>p<=0?0:Math.min(254,Math.round((Math.log10(Math.min(100,p))+1)*84.33333333333333+1));
const daliToPct=v=>v===0||v===255?0:Math.round(10**((v-1)/84.33333333333333-1));

/* Password encryption: PBKDF2-SHA1(1000) -> AES-256-CBC, as in original app */
let aesKey,aesIv;
async function initCrypto(){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode('2F$5b9'),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-1',salt:enc.encode('LUXeye - OSRAM - 2016 !1#2#3%'),iterations:1000},base,48*8));
  aesKey=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['encrypt']);
  aesIv=bits.slice(32,48);
}
function strBytes(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);if(c<128)o.push(c);else if(c<256)o.push(c)}return new Uint8Array(o)}
async function encryptPwd(pw){if(!aesKey)await initCrypto();return new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv:aesIv},aesKey,strBytes(pw)))}
async function authHash(userType,cr,sc,pw16){
  const b=new Uint8Array(33);b[0]=userType;b.set(cr,1);b.set(sc,9);b.set(pw16.slice(0,16),17);
  return new Uint8Array(await crypto.subtle.digest('SHA-256',b)).slice(0,8);
}

class Ctrl{
  constructor(dev){this.dev=dev;this.id=dev.id;this.state='idle';this.msg='Nije spojen';this.on=false;this.pct=0;this.q=Promise.resolve();this.fmt=store.get('fmt_'+dev.id,'ext');
    this.name=niceName(dev.name||store.get('name_'+dev.id,'Kontroler'));if(dev.name)store.set('name_'+dev.id,dev.name);
    dev.addEventListener('gattserverdisconnected',()=>{this.set('idle','Veza prekinuta');this.chars=null});}
  set(s,m){this.state=s;this.msg=m;render()}
  run(fn){const p=this.q.then(fn,fn);this.q=p.catch(()=>{});return p}
  async connect(){
    if(this.dev.gatt.connected&&this.chars)return;
    this.set('busy','Spajanje…');
    try{
      const srv=await this.dev.gatt.connect();
      const ls=await srv.getPrimaryService(UUID.light),cs=await srv.getPrimaryService(UUID.conf);
      this.chars={cmd:await ls.getCharacteristic(UUID.cmd),lvl:await ls.getCharacteristic(UUID.lvl),med:await cs.getCharacteristic(UUID.med)};
      this.set('busy','Prijava…');
      await this.auth();
      await this.readState();
      try{await this.chars.lvl.startNotifications();this.chars.lvl.addEventListener('characteristicvaluechanged',e=>this.onLevel(new Uint8Array(e.target.value.buffer)))}catch(e){log(this.name,'notify',e.message)}
      this.set('ok','Spojen');
    }catch(e){log(this.name,'GREŠKA',e.message);this.set('err',e.message.slice(0,80));try{this.dev.gatt.disconnect()}catch{}this.chars=null;throw e}
  }
  /* Medium property: [topic, prop, flags, data(17)] write, then poll-read for valid answer */
  async medium(topic,prop,data){
    const pkt=new Uint8Array(20);pkt[0]=topic;pkt[1]=prop;pkt.set(data,3);
    await this.chars.med.writeValueWithResponse(pkt);await sleep(50);
    const t0=Date.now();
    while(Date.now()-t0<2500){
      const v=new Uint8Array((await this.chars.med.readValue()).buffer);
      if(v[0]===topic&&v[1]===prop&&(v[2]&2)&&!(v[2]&4))return v.slice(3);
      await sleep(70);
    }
    throw new Error('Kontroler ne odgovara');
  }
  async auth(){
    const ut=$('#optUser').checked?2:1;
    const tok=hex(store.get('tok_'+this.id+'_'+ut,'0000000000000000'));
    const ch=await this.medium(14,0,new Uint8Array([ut,...tok]));
    const ans=ch[0];log(this.name,'challenge odgovor',ans);
    if(ans===0)return;
    let pw16;
    if(ans===1)pw16=DEFAULT_PW;
    else if(ans===2){
      let pw=store.get('pw_'+this.id,null);
      if(pw==null){pw=await askPw(this.name);if(pw==null)throw new Error('Prijava otkazana')}
      pw16=await encryptPwd(pw);this._pw=pw;
    }else throw new Error(ans===3?'Previše pokušaja, pričekaj pa probaj opet':'Kontroler odbija prijavu ('+ans+')');
    const sc=ch.slice(1,9),cr=crypto.getRandomValues(new Uint8Array(8));
    const h=await authHash(ut,cr,sc,pw16);
    const r=await this.medium(14,1,new Uint8Array([ut,...cr,...h]));
    const t=r.slice(0,8);
    if(t.every(x=>x===0)){store.set('pw_'+this.id,null);throw new Error(ans===2?'Kriva lozinka':'Prijava odbijena')}
    store.set('tok_'+this.id+'_'+ut,toHex(t));
    if(this._pw!=null&&this._save)store.set('pw_'+this.id,this._pw);
    log(this.name,'prijava OK');
  }
  async readState(){
    try{const v=new Uint8Array((await this.chars.lvl.readValue()).buffer);this.onLevel(v)}catch(e){log(this.name,'čitanje razine',e.message)}
    await this.readGroups();
  }
  /* LiveData topic 7, prop 30: data[1+3*i] = DALI level of group i+1 */
  async readGroups(){
    if(this.fmt!=='ext')return;
    try{const d=await this.medium(7,30,new Uint8Array(13));
      this.groups=[0,1,2,3].map(i=>{const v=d[1+3*i];return {on:v>0&&v!==255,pct:daliToPct(v)}});render();
    }catch(e){log(this.name,'čitanje grupa',e.message)}
  }
  setGroupOn(g,on){return this.run(async()=>{await this.connect();const s=on?1:0;
    await this.chars.cmd.writeValueWithResponse(new Uint8Array([s,1,1,g]));
    await sleep(150);await this.readGroups()})}
  setGroupPct(g,p){return this.run(async()=>{await this.connect();const d=pctToDali(p);
    await this.chars.lvl.writeValueWithResponse(new Uint8Array([d,0,0,0,1,1,g]));
    if(this.groups)this.groups[g-1]={on:d>0,pct:p};render()})}
  onLevel(v){if(!v.length)return;this.pct=daliToPct(v[0]);this.on=v[0]>0&&v[0]!==255;render()}
  async write(ch,ext,short){
    if(this.fmt==='ext'){
      try{await ch.writeValueWithResponse(ext);return}
      catch(e){log(this.name,'prošireni format odbijen, probam kratki',e.message);this.fmt='short';store.set('fmt_'+this.id,'short')}
    }
    await ch.writeValueWithResponse(short);
  }
  setOn(on){return this.run(async()=>{await this.connect();const s=on?1:0;
    await this.write(this.chars.cmd,new Uint8Array([s,1,0,0]),new Uint8Array([s]));
    this.on=on;if(on&&!this.pct)this.pct=100;await sleep(150);await this.readState();render()})}
  setPct(p){return this.run(async()=>{await this.connect();const d=pctToDali(p);
    await this.write(this.chars.lvl,new Uint8Array([d,0,0,0,1,0,0]),new Uint8Array([d,0,0,0]));
    this.pct=p;this.on=d>0;await sleep(150);await this.readGroups();render()})}
  forget(){try{this.dev.gatt.disconnect()}catch{}const ids=store.get('ids',[]).filter(i=>i!==this.id);store.set('ids',ids);ctrls.delete(this.id);try{this.dev.forget&&this.dev.forget()}catch{}render()}
}
function niceName(n){const i=n.search(/[_-]/);return (i>=0&&/^(Osbt|Invt|Ledv|Leye)/.test(n)?n.slice(i+1):n).trim()||n}

const ctrls=new Map();
let pwResolve;
function askPw(name){return new Promise(res=>{pwResolve=res;$('#dtxt').textContent='Kontroler „'+name+'“ traži lozinku koju si postavio u BT Config aplikaciji.';$('#dpw').value='';$('#dlg').showModal()})}
$('#dlg').addEventListener('close',()=>{const ok=$('#dlg').returnValue==='ok';const v=$('#dpw').value;for(const c of ctrls.values())c._save=$('#dsave').checked;pwResolve&&pwResolve(ok?v:null);pwResolve=null});

function render(){
  const g=$('#grid');
  if(!ctrls.size){g.innerHTML='<div class="empty">Još nema kontrolera.<br>Tapni <b>+ Dodaj kontroler</b> i odaberi jedan od svojih Osram uređaja. Ponovi za sva četiri.</div>';return}
  for(const c of ctrls.values()){
    let el=document.getElementById('c_'+c.id);
    if(!el){el=document.createElement('div');el.className='card';el.id='c_'+c.id;
      el.innerHTML='<div class="glow"></div><div class="top"><span class="dot"></span><span class="name"></span><button class="sw" aria-label="Upali ili ugasi"></button></div><div class="st"></div><div class="lvl"><input type="range" min="0" max="100" step="1" aria-label="Razina svjetla"><span class="pct"></span></div><div class="pre"><button data-p="10">10%</button><button data-p="30">30%</button><button data-p="60">60%</button><button data-p="100">100%</button></div><details class="grps" open><summary>Grupe</summary><div class="gl"></div></details><div class="act"><button data-a="conn">Spoji</button><button data-a="pw">Lozinka</button><button data-a="del">Ukloni</button></div>';
      g.appendChild(el);
      const r=el.querySelector('input');let tm;
      r.addEventListener('input',()=>{el.querySelector('.pct').textContent=r.value+'%';clearTimeout(tm);tm=setTimeout(()=>c.setPct(+r.value).catch(()=>{}),180)});
      el.querySelector('.sw').onclick=()=>c.setOn(!c.on).catch(()=>{});
      el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>c.setPct(+b.dataset.p).catch(()=>{}));
      el.querySelector('[data-a=conn]').onclick=()=>c.run(()=>c.connect()).catch(()=>{});
      el.querySelector('[data-a=pw]').onclick=async()=>{const pw=await askPw(c.name);if(pw!=null){store.set('pw_'+c.id,pw);store.set('tok_'+c.id+'_1',null);store.set('tok_'+c.id+'_2',null);log(c.name,'lozinka spremljena')}};
      el.querySelector('[data-a=del]').onclick=()=>{el.remove();c.forget()};
      const gl=el.querySelector('.gl');
      gl.innerHTML=[1,2,3,4].map(g=>'<div class="g" data-g="'+g+'"><input type="text" aria-label="Naziv grupe '+g+'"><button class="sw" aria-label="Upali ili ugasi grupu '+g+'"></button><div class="lvl"><input type="range" min="0" max="100" step="1" aria-label="Razina grupe '+g+'"><span class="pct"></span></div></div>').join('');
      gl.querySelectorAll('.g').forEach(row=>{const g=+row.dataset.g,nm=row.querySelector('input[type=text]'),rr=row.querySelector('input[type=range]');let t2;
        nm.value=store.get('gname_'+c.id+'_'+g,'Grupa '+g);nm.onchange=()=>store.set('gname_'+c.id+'_'+g,nm.value.trim()||'Grupa '+g);
        row.querySelector('.sw').onclick=()=>c.setGroupOn(g,!(c.groups&&c.groups[g-1].on)).catch(()=>{});
        rr.addEventListener('input',()=>{row.querySelector('.pct').textContent=rr.value+'%';clearTimeout(t2);t2=setTimeout(()=>c.setGroupPct(g,+rr.value).catch(()=>{}),180)});
      });
      const gd=el.querySelector('.grps');gd.open=store.get('gopen_'+c.id,true);gd.addEventListener('toggle',()=>store.set('gopen_'+c.id,gd.open));
    }
    const gd=el.querySelector('.grps');gd.style.display=c.fmt==='ext'?'':'none';
    el.querySelectorAll('.g').forEach(row=>{const g=c.groups&&c.groups[+row.dataset.g-1],rr=row.querySelector('input[type=range]');
      row.querySelector('.sw').setAttribute('aria-pressed',!!(g&&g.on));
      if(document.activeElement!==rr){const v=g&&g.on?g.pct:0;rr.value=v;row.querySelector('.pct').textContent=g?v+'%':'–'}});
    el.classList.toggle('on',c.on);
    el.querySelector('.glow').style.setProperty('--g',c.on?(0.08+c.pct/100*0.32).toFixed(2):0);
    el.querySelector('.dot').className='dot '+(c.state==='ok'?'ok':c.state==='busy'?'busy':c.state==='err'?'err':'');
    el.querySelector('.name').textContent=c.name;
    el.querySelector('.st').textContent=c.msg;
    el.querySelector('.sw').setAttribute('aria-pressed',c.on);
    const r=el.querySelector('input');if(document.activeElement!==r){r.value=c.on?c.pct:0;el.querySelector('.pct').textContent=(c.on?c.pct:0)+'%'}
  }
  g.querySelector('.empty')?.remove();
}
function addDev(dev){if(ctrls.has(dev.id))return ctrls.get(dev.id);const c=new Ctrl(dev);ctrls.set(dev.id,c);const ids=store.get('ids',[]);if(!ids.includes(dev.id)){ids.push(dev.id);store.set('ids',ids)}render();return c}

$('#bAdd').onclick=async()=>{
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Osbt'},{namePrefix:'Invt'},{namePrefix:'Ledv'},{namePrefix:'Leye'}],optionalServices:[UUID.light,UUID.conf,UUID.ident]});
    const c=addDev(dev);c.run(()=>c.connect()).catch(()=>{});
  }catch(e){if(e.name!=='NotFoundError')log('Dodavanje',e.message)}
};
$('#bConn').onclick=()=>{for(const c of ctrls.values())c.run(()=>c.connect()).catch(()=>{})};
$('#bAll1').onclick=()=>{for(const c of ctrls.values())c.setOn(true).catch(()=>{})};
$('#bAll0').onclick=()=>{for(const c of ctrls.values())c.setOn(false).catch(()=>{})};
$('#optUser').checked=store.get('user',false);
$('#optUser').onchange=e=>store.set('user',e.target.checked);
$('#bForget').onclick=()=>{try{Object.keys(localStorage).filter(k=>/^svj_(pw|tok)_/.test(k)).forEach(k=>localStorage.removeItem(k))}catch{}log('Lozinke i tokeni obrisani')};

(async()=>{
  if(!navigator.bluetooth){$('#warn').innerHTML='<div class="warn">Ovaj preglednik ne podržava Web Bluetooth. Otvori stranicu u <b>Chromeu na Androidu</b>, preko https:// adrese ili localhosta.</div>';['#bAdd','#bConn','#bAll1','#bAll0'].forEach(s=>$(s).disabled=true);render();return}
  if(navigator.bluetooth.getDevices){
    try{const devs=await navigator.bluetooth.getDevices();const ids=store.get('ids',[]);for(const d of devs)if(ids.includes(d.id))addDev(d);
      if(ctrls.size){log('Pronađeno spremljenih kontrolera:',ctrls.size);for(const c of ctrls.values())c.run(()=>c.connect()).catch(()=>{})}
    }catch(e){log('getDevices',e.message)}
  }else log('Preglednik ne pamti uređaje između posjeta; kontrolere dodaj ponovno nakon osvježavanja.');
  render();
})();
}
</script>
</body>
</html>
